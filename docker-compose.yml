services:
  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - rabbit
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-invoicing_dev}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbit:5672/}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

  db:
    image: postgres:15
    container_name: invoicing_db
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      # A default DB is still created for convenience; the init script below creates both dev and test DBs
      POSTGRES_DB: ${POSTGRES_DB:-invoicing_dev}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  rabbit:
    image: rabbitmq:3-management
    container_name: invoicing_rabbit
    ports:
      - "5672:5672"
      - "15672:15672"

  # Acceptance tests run locally via Behave; no dedicated container

volumes:
  db_data:
